<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
  </head>
  <body>

    <div class="home-container">
      <div class="sidebar">
        <div class="user">
          <h5 class="my-3 ms-4">Moriarty</h5>
          <div class="bottom-line"></div>
        </div>
        <div class="side-nav-content my-3 ms-4">
          <h4 class="mb-4">Sections:</h4>
          <div class="section">
            <h5 class="work">Work</h5>
          </div>
          <div class="create-Btn">
            <button class="createBtn btnStyle" type="button">Create section</button>
          </div>
        </div>
      </div>

      <div class="modal-background d-none">
        <div class="modal-container d-none">
          <div class="modal-header d-flex 
          justify-content-between align-items-center mb-3">
              <h5 class="">Add New Task</h5>
              <button class="closeBtn fs-5"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <form action="#">
            
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" name="title" id="title">
            </div>

            <div class="middle-group">
                <div class="form-group">
                  <label for="select">Priority</label>
                  <select name="select" id="select">
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                    <option value="High">High</option>
                  </select>
                </div>
                <!-- <div class="form-group">
                  
                </div> -->
            </div>
            <div class="form-group">
              <label for="desc">Description</label>
              <textarea name="desc" id="description" 
              placeholder="Add details..."></textarea>
            </div>

            <div class="save-div d-flex w-100 justify-content-end pe-4 mt-4">
              <button class="saveBtn btnStyle" type="button">Save</button>
            </div>
          </form>
        
        </div>
      </div>

      <div class="content-back">
        <div class="content">

        </div>
      </div>

    </div>

  </body>
</html>
